name: 🚀 Deploy AIS

on:
  push:
    branches:
      - staging
      - main

jobs:

  # ============================================================
  # STAGING DEPLOYMENT
  # ============================================================
  deploy-staging:

    # Only deploy the staging branch for now.
    # Main is reserved for future production deployment.
    if: github.ref == 'refs/heads/staging'

    runs-on: ubuntu-latest

    env:
      SSH_PORT: 22
      DEPLOY_PATH: /home/onesys/htdocs/AIS

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # PHP
      # ==========================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, mysqli, zip
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction


      # ==========================================================
      # NODE / TAILWIND CSS
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: |
          rm -rf node_modules
          npm ci

      # ==========================================================
      # BUILD TAILWIND CSS
      # ==========================================================
      - name: Build Tailwind CSS
        run: |
          npm run build:css:min

      # ==========================================================
      # VERIFY CSS BUILD
      # ==========================================================
      - name: Verify CSS build
        run: |
          if [ ! -f "public/css/main.css" ]; then
            echo "ERROR: Tailwind CSS build was not generated."
            exit 1
          fi

          echo "Tailwind CSS build found."
          ls -lh public/css/main.css


      # ==========================================================
      # SSH
      # ==========================================================
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_PRIVATE_KEY }}


      # ==========================================================
      # VERIFY VPS DEPLOYMENT DIRECTORY
      # ==========================================================
      - name: Verify deployment directory
        run: |
          ssh \
            -p ${SSH_PORT} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << EOF

          mkdir -p ${DEPLOY_PATH}

          echo "Deployment directory:"
          ls -ld ${DEPLOY_PATH}

          EOF


      # ==========================================================
      # DEPLOY
      # ==========================================================
      - name: Deploy AIS to staging
        run: |
          rsync -az --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude="writable" \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${DEPLOY_PATH}


      # ==========================================================
      # PERMISSIONS
      # ==========================================================
      - name: Set writable permissions
        run: |
          ssh \
            -p ${SSH_PORT} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << EOF

          cd ${DEPLOY_PATH}

          if [ -d writable ]; then
            find writable -type d -exec chmod 775 {} \;
            find writable -type f -exec chmod 664 {} \;
          fi

          EOF


      # ==========================================================
      # DEPLOYMENT COMPLETE
      # ==========================================================
      - name: Deployment complete
        run: |
          echo "=========================================="
          echo "AIS staging deployment successful!"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Path: ${DEPLOY_PATH}"
          echo "=========================================="


  # ============================================================
  # FUTURE PRODUCTION DEPLOYMENT
  # ============================================================
  deploy-production:

    # Reserved for future production deployment.
    # DO NOT enable until the production domain/path is ready.
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Production deployment reserved
        run: |
          echo "=========================================="
          echo "Production deployment is currently disabled."
          echo "Branch: main"
          echo "Production deployment path/domain not yet configured."
          echo "=========================================="